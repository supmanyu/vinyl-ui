<!doctype html>
<!--
  Source for banner.png (the README header). Re-render with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=2 --window-size=1280,340 --default-background-color=00000000 \
    --virtual-time-budget=8000 --screenshot=.github/assets/banner.png "file://$PWD/.github/assets/banner.html"
  Colours are the Vinyl UI tokens (packages/tokens/src/tokens.ts).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=VT323&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --night: #0b0b1e;
        --magenta: #ff2e97;
        --orange: #ff6b35;
        --yellow: #ffd23f;
        --cream: #f4ebd9;
        --muted: #a2a3b1;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 340px;
        background: transparent;
      }
      .banner {
        position: relative;
        width: 1280px;
        height: 340px;
        border-radius: 20px;
        overflow: hidden;
        background: var(--night);
      }
      .lockup {
        position: absolute;
        left: 88px;
        top: 50%;
        transform: translateY(-58%);
      }
      .word {
        font: italic 900 104px/1 "Orbitron", sans-serif;
        letter-spacing: -2px;
        color: var(--cream);
        text-shadow:
          -2px 0 #ff0055,
          2px 0 #00b8ff;
      }
      .tagline {
        margin: 18px 0 0 20px;
        font: 400 30px/1 "VT323", monospace;
        letter-spacing: 2px;
        color: var(--muted);
        text-transform: uppercase;
      }
      /* Outrun sun: a few slits widening toward the bottom */
      .sun {
        position: absolute;
        right: 104px;
        top: 50%;
        width: 200px;
        height: 200px;
        transform: translateY(-58%);
        border-radius: 50%;
        background: linear-gradient(to bottom, var(--yellow), var(--orange) 50%, var(--magenta));
        mask-image: linear-gradient(
          to bottom,
          #000 0 56%,
          transparent 56% 59%,
          #000 59% 68%,
          transparent 68% 72.5%,
          #000 72.5% 80%,
          transparent 80% 86%,
          #000 86% 91%,
          transparent 91%
        );
      }
      .bars {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        display: flex;
      }
      .bars span {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="lockup">
        <div class="word">VINYL UI</div>
        <div class="tagline">An 80s design system for React &amp; React Native</div>
      </div>
      <div class="sun"></div>
      <div class="bars">
        <span style="background: #c0c0c0"></span><span style="background: #c0c000"></span
        ><span style="background: #00c0c0"></span><span style="background: #00c000"></span
        ><span style="background: #c000c0"></span><span style="background: #c00000"></span
        ><span style="background: #0000c0"></span>
      </div>
    </div>
  </body>
</html>
