<!doctype html>
<!--
  Source for effects.png (README effects showcase). Re-render with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=2 --window-size=1280,560 --default-background-color=00000000 \
    --virtual-time-budget=8000 --screenshot=.github/assets/effects.png "file://$PWD/.github/assets/effects.html"
  Each tile is a still frame of the matching @vinyl-ui/effects utility.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=VT323&family=Space+Grotesk:wght@700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --night: #0b0b1e;
        --ultraviolet: #7b2cbf;
        --magenta: #ff2e97;
        --cyan: #00e5ff;
        --orange: #ff6b35;
        --yellow: #ffd23f;
        --blue: #3d63ff;
        --cream: #f4ebd9;
        --vice: linear-gradient(180deg, var(--yellow), var(--orange), var(--magenta), var(--ultraviolet), var(--blue));
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 560px;
        background: transparent;
      }
      .grid {
        width: 1280px;
        height: 560px;
        padding: 24px;
        border-radius: 20px;
        background: var(--night);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 20px;
      }
      .card {
        display: flex;
        flex-direction: column;
        border: 2px solid var(--cream);
        border-radius: 6px;
        box-shadow: 6px 6px 0 var(--magenta);
        overflow: hidden;
        background: #14112c;
      }
      .stage {
        position: relative;
        flex: 1;
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
      }
      .label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 14px;
        border-top: 2px solid var(--cream);
        font: 700 14px/1 "Space Grotesk", sans-serif;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--cream);
      }
      .label code {
        font: 400 20px/1 "VT323", monospace;
        letter-spacing: 1px;
        text-transform: none;
        color: var(--cyan);
      }
      .display {
        font: italic 900 64px/1 "Orbitron", sans-serif;
        letter-spacing: -1px;
      }

      /* RGB split mid-glitch */
      .rgb {
        font-size: 52px;
        color: var(--cream);
        text-shadow:
          -4px 0 #ff0055,
          4px 0 #00b8ff;
      }
      .slice {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        clip-path: inset(47% 0 41% 0);
        transform: translateX(10px);
      }

      /* Film burn */
      .burnbg {
        background: var(--ultraviolet);
      }
      .burnbg::after {
        content: "";
        position: absolute;
        inset: -20%;
        mix-blend-mode: screen;
        background:
          radial-gradient(40% 50% at 18% 82%, color-mix(in oklab, #ff7a1a 60%, white), #ff7a1a 25%, transparent 70%),
          radial-gradient(30% 40% at 88% 14%, color-mix(in oklab, #ff7a1a 60%, var(--magenta)), transparent 70%);
      }
      .burn-text {
        position: relative;
        z-index: 2;
        font: italic 900 34px/1 "Orbitron", sans-serif;
        color: var(--cream);
      }

      /* Scanlines */
      .scan {
        background: var(--cyan);
      }
      .scan::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        background: repeating-linear-gradient(to bottom, transparent 0 2px, #00000040 2px 3px);
      }
      .scan-text {
        font: 400 84px/1 "VT323", monospace;
        color: var(--night);
      }

      /* SMPTE iris wipe, mid-transition */
      .bars {
        position: absolute;
        inset: 0;
        display: flex;
        clip-path: circle(34% at 50% 50%);
      }
      .bars span {
        flex: 1;
      }

      /* Neon draw, mid-trace */
      .draw path {
        fill: none;
        stroke: var(--magenta);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
      }
      .draw {
        width: 150px;
        height: 150px;
        overflow: visible;
        filter: drop-shadow(0 0 8px var(--magenta));
      }

      /* Stripe text */
      .stripes {
        font: italic 900 108px/1 "Orbitron", sans-serif;
        padding-right: 0.15em;
        color: transparent;
        -webkit-text-fill-color: transparent;
        background: var(--vice);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 11px, transparent 11px 16px);
        mask-image: repeating-linear-gradient(to bottom, #000 0 11px, transparent 11px 16px);
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="card">
        <div class="stage">
          <span class="display rgb">CHROMA</span>
          <div class="slice"><span class="display rgb">CHROMA</span></div>
        </div>
        <div class="label">RGB split <code>&lt;RGBSplit animated&gt;</code></div>
      </div>
      <div class="card">
        <div class="stage burnbg"><span class="burn-text">SUMMER '86</span></div>
        <div class="label">Film burn <code>&lt;FilmBurn&gt;</code></div>
      </div>
      <div class="card">
        <div class="stage scan"><span class="scan-text">CH 03</span></div>
        <div class="label">Scanlines <code>&lt;Scanlines&gt;</code></div>
      </div>
      <div class="card">
        <div class="stage">
          <div class="bars">
            <span style="background: #c0c0c0"></span><span style="background: #c0c000"></span
            ><span style="background: #00c0c0"></span><span style="background: #00c000"></span
            ><span style="background: #c000c0"></span><span style="background: #c00000"></span
            ><span style="background: #0000c0"></span>
          </div>
        </div>
        <div class="label">SMPTE wipe <code>pattern="iris"</code></div>
      </div>
      <div class="card">
        <div class="stage">
          <svg class="draw" viewBox="0 0 100 100" aria-hidden="true">
            <path style="stroke-dashoffset: 0" d="M20 8 H80 Q92 8 92 20 V80 Q92 92 80 92 H20 Q8 92 8 80 V20 Q8 8 20 8 Z" />
            <path style="stroke-dashoffset: 940" d="M28 26 L48 70 L68 26" />
            <path
              style="stroke-dashoffset: 1000"
              d="M74.0 62.0 L76.5 68.6 L83.5 68.9 L78.0 73.3 L79.9 80.1 L74.0 76.2 L68.1 80.1 L70.0 73.3 L64.5 68.9 L71.5 68.6 Z"
            />
          </svg>
        </div>
        <div class="label">Neon draw <code>&lt;NeonDraw&gt;</code></div>
      </div>
      <div class="card">
        <div class="stage"><span class="stripes">86</span></div>
        <div class="label">Stripe text <code>&lt;StripeText&gt;</code></div>
      </div>
    </div>
  </body>
</html>
